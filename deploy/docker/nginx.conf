worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;

    # UBI nginx runs unprivileged; use writable temp paths.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server {
        listen 8080;
        root /opt/app-root/src;
        index index.html;

        # Proxy API calls to the api service (same-origin for the frontend).
        # Use a variable + Docker's embedded DNS resolver so nginx does NOT fail
        # at startup if the api service isn't up yet (resolves per-request).
        location /api/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $api_upstream "http://api:8000";
            # With a variable proxy_pass, nginx does NOT auto-strip the location
            # prefix, so strip /api/ explicitly before proxying to the api root.
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # SPA fallback.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
