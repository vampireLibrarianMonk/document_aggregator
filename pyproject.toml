[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "document-aggregator"
version = "0.1.0"
description = "Local-first document ingestion, normalization, search, and aggregation platform"
requires-python = ">=3.10"
license = "MIT"

dependencies = [
    "fastapi==0.115.2",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "python-multipart==0.0.12",
    "python-docx==1.1.2",
    "python-pptx==1.0.2",
    "pypdf==5.0.1",
    "reportlab==4.2.2",
    "Pillow==10.4.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.11.12",
    "mypy==1.15.0",
    "pytest==8.3.5",
    "python-dotenv==1.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "E501",  # Line length handled by ruff-format; long strings acceptable
    "N806",  # Non-lowercase variable in function — used for class-like constants
]

[tool.ruff.lint.per-file-ignores]
"backend/seed.py" = ["E402"]            # Late imports after sys.path bootstrap
"backend/try_reconcile.py" = ["E402"]   # Late imports after sys.path bootstrap
"backend/app/main.py" = ["E402"]        # FastAPI import ordering

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
