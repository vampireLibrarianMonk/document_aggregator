repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--allow-multiple-documents']
      - id: check-json
        exclude: 'tsconfig\..+\.json$'
      - id: check-toml
      - id: check-ast
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: check-case-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.0
        args: [--ignore-missing-imports]
        pass_filenames: false
        entry: mypy backend/app/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        name: bandit (python code security)
        args: ["-ll", "-r", "backend/app"]
        pass_filenames: false

  - repo: https://github.com/pypa/pip-audit
    rev: v2.7.3
    hooks:
      - id: pip-audit
        name: pip-audit (python dependency CVEs)
        # Scan the production dependency set; fails on a known CVE with a fix.
        args: ["-r", "backend/requirements-api.txt"]
        pass_filenames: false

  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.1-beta
    hooks:
      - id: hadolint
        name: hadolint (Dockerfile hardening)
        files: '(^|/)Dockerfile[^/]*$'

  - repo: local
    hooks:
      - id: oxlint
        name: oxlint (TypeScript/React)
        language: system
        entry: npx --prefix frontend oxlint
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: true
        types: [file]

      - id: npm-audit
        name: npm audit (frontend production deps)
        language: system
        # Only the SHIPPED deps (--omit=dev); dev-toolchain advisories are
        # tracked separately and never reach the built app.
        entry: bash -c 'cd frontend && npm audit --omit=dev --audit-level=high'
        files: ^frontend/package(-lock)?\.json$
        pass_filenames: false

# --------------------------------------------------------------------------
# NOT wired as hooks (too heavy / need built artifacts) — run on demand:
#   container image CVEs:  docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
#                            aquasec/trivy image --severity HIGH,CRITICAL <image>
#   full transitive SBOM:  python scripts/generate_sbom.py
# See SBOM.md and deploy/DOCKER.md.
# --------------------------------------------------------------------------
