  #     POSTGRESQL_USER: docagg
  #     POSTGRESQL_PASSWORD: change_me
  #     POSTGRESQL_DATABASE: docagg
  #   volumes:
  #     - pgdata:/var/lib/pgsql/data

volumes:
  data:
