# Document Aggregation Platform — modular RHEL/UBI stack.
#
# Four concerns, four images (modular per software endpoint):
#   api       lean FastAPI (no LibreOffice); serves HTTP, enqueues jobs
#   worker    heavy image (LibreOffice + pinned fonts), runs the templated
#             worker loop against the shared job queue
#   frontend  nginx (UBI) serving the built React app, proxies /api -> api
#   data      a shared named volume for DATA_DIR (jobs.db, projects, indexes)
#
# JSON/SQLite store now; a PostgreSQL service is stubbed below for the upgrade.

services:
  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    environment:
      DATA_DIR: /data
      # The api image has no embedding stack, so it runs on the hashing embedder
      # regardless; set it explicitly and guard the network for parity.
      EMBEDDING_BACKEND: hashing
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      # Bedrock scenario generation off by default (air-gap). To use the SAME
      # role/credentials as the host, uncomment the AWS_* lines here and the
      # ~/.aws mount below; boto3's credential chain then resolves the host's
      # profile/SSO/role inside the container exactly as it does locally.
      BEDROCK_ENABLED: "${BEDROCK_ENABLED:-false}"
      BEDROCK_REGION: "${BEDROCK_REGION:-us-east-1}"
      BEDROCK_SCENARIO_MODEL: "${BEDROCK_SCENARIO_MODEL:-}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      # The container runs as an arbitrary UID (OpenShift pattern), so $HOME is
      # unreliable; point boto3 at the mounted config EXPLICITLY instead of
      # relying on ~/.aws discovery. These resolve the host's [default] static
      # access key. (AWS_PROFILE is intentionally NOT set: an empty value can be
      # read as a profile named "" and break [default] resolution.)
      AWS_CONFIG_FILE: /aws/config
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
    volumes:
      - data:/data
      # Mount the host AWS config read-only so the container uses the SAME
      # static credentials as this workspace. Harmless if the host dir is absent
      # on an air-gapped host (boto3 finds no creds -> offline, the safe
      # default). On Windows the host path is %USERPROFILE%\.aws.
      - "${AWS_DIR:-${USERPROFILE}/.aws}:/aws:ro"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.rhel
    environment:
      DATA_DIR: /data
      # Air-gap default: the deterministic hashing embedder (no network, always
      # available). The worker image ships sentence-transformers, but its weights
      # are NOT baked in, so we must not attempt a live model download. To use
      # the real model in the enclave, bake/mount the weights and set
      # EMBEDDING_BACKEND=sentence-transformers. The offline flags below are a
      # hard guard: even on "auto", no request ever leaves the enclave.
      EMBEDDING_BACKEND: hashing
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      BEDROCK_ENABLED: "false"
      WORKER_CONCURRENCY: "2"
    volumes:
      - data:/data
    depends_on:
      - api

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.frontend
    ports:
      - "8080:8080"
    depends_on:
      - api

  # --- Deferred upgrade: PostgreSQL job/record store -----------------------
