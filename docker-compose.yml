# Document Aggregation Platform — LOCAL developer stack (full capability).
#
# This compose file targets LOCAL runs and uses Debian-based images that bake in
# the complete offline capability: real MiniLM embeddings, tesseract OCR, and
# LibreOffice (DOCX->PDF geometry tier). A plain `docker compose up` gives a
# fully capable, fully offline stack.
#
# The ENCLAVE / OpenShift deployment target uses the UBI images instead
# (deploy/docker/Dockerfile.api, Dockerfile.rhel) — same baked embedding model,
# with tesseract + LibreOffice coming from the enclave's mirrored RHEL
# AppStream. Point the build.dockerfile keys at those for an enclave build.
#
# Four concerns, four images (modular per software endpoint):
#   api       FastAPI; ingests in-process; serves HTTP, enqueues jobs
#   worker    runs the templated worker loop against the shared job queue
#   frontend  nginx serving the built React app, proxies /api -> api
#   data      a shared named volume for DATA_DIR (jobs.db, projects, indexes)
#
# JSON/SQLite store now; a PostgreSQL service is stubbed below for the upgrade.

services:
  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api.local
    environment:
      DATA_DIR: /data
      # Full local capability baked into the api image: real MiniLM embeddings,
      # OCR, and LibreOffice. The MiniLM weights are baked at build time; the
      # offline flags are a hard guard so no request ever leaves the host.
      EMBEDDING_BACKEND: "${EMBEDDING_BACKEND:-sentence-transformers}"
      EMBEDDINGS_ENABLED: "true"
      OCR_ENABLED: "${OCR_ENABLED:-true}"
      # In-app Samples tab: off by default (samples run from the repo per the
      # user guide). Set SAMPLES_ENABLED=true to expose the Samples tab.
      SAMPLES_ENABLED: "${SAMPLES_ENABLED:-false}"
      # In-app Diagnostics page (/diagnostics): off by default.
      DIAGNOSTICS_ENABLED: "${DIAGNOSTICS_ENABLED:-false}"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      # Bedrock scenario generation off by default (air-gap). To use the SAME
      # role/credentials as the host, uncomment the AWS_* lines here and the
      # ~/.aws mount below; boto3's credential chain then resolves the host's
      # profile/SSO/role inside the container exactly as it does locally.
      BEDROCK_ENABLED: "${BEDROCK_ENABLED:-false}"
      BEDROCK_REGION: "${BEDROCK_REGION:-us-east-1}"
      BEDROCK_SCENARIO_MODEL: "${BEDROCK_SCENARIO_MODEL:-}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      # The container runs as an arbitrary UID (OpenShift pattern), so $HOME is
      # unreliable; point boto3 at the mounted config EXPLICITLY instead of
      # relying on ~/.aws discovery. These resolve the host's [default] static
      # access key. (AWS_PROFILE is intentionally NOT set: an empty value can be
      # read as a profile named "" and break [default] resolution.)
      AWS_CONFIG_FILE: /aws/config
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
    volumes:
      - data:/data
      # Mount the host AWS config read-only so the container uses the SAME
      # static credentials as this workspace. Harmless if the host dir is absent
      # on an air-gapped host (boto3 finds no creds -> offline, the safe
      # default). On Windows the host path is %USERPROFILE%\.aws.
      - "${AWS_DIR:-${USERPROFILE}/.aws}:/aws:ro"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.worker.local
    environment:
      DATA_DIR: /data
      # Full local capability: the worker image bakes the MiniLM weights at
      # build time, so real embeddings run fully offline. OCR + LibreOffice are
      # installed too. The offline flags are a hard guard: no request ever
      # leaves the host. Override EMBEDDING_BACKEND=hashing to force the
      # deterministic fallback.
      EMBEDDING_BACKEND: "${EMBEDDING_BACKEND:-sentence-transformers}"
      EMBEDDINGS_ENABLED: "true"
      OCR_ENABLED: "${OCR_ENABLED:-true}"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      BEDROCK_ENABLED: "false"
      WORKER_CONCURRENCY: "2"
    volumes:
      - data:/data
    depends_on:
      - api

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.frontend
    ports:
      - "8080:8080"
    depends_on:
      - api

  # --- Deferred upgrade: PostgreSQL job/record store -----------------------
  # postgres:
  #   image: registry.redhat.io/rhel9/postgresql-16:latest
